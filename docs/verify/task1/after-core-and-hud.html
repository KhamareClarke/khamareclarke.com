<!DOCTYPE html>
<html><head><meta charset="utf-8"/><title>after-core-and-hud</title>
<style>/* JARVIS — blue holographic voice assistant theme */
:root {
  --jarvis-bg: #030712;
  --jarvis-surface: #0a1628;
  --jarvis-card: #0f1d32;
  --jarvis-cyan: #22d3ee;
  --jarvis-sky: #38bdf8;
  --jarvis-blue: #0ea5e9;
  --jarvis-glow: rgba(56, 189, 248, 0.35);
  --jarvis-glow-soft: rgba(34, 211, 238, 0.12);
  --jarvis-text: #e0f2fe;
  --jarvis-muted: #64748b;
  --jarvis-border: rgba(56, 189, 248, 0.2);
  --jarvis-radius: 16px;
}

@keyframes jarvis-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.45); }
  50% { box-shadow: 0 0 0 14px rgba(56, 189, 248, 0); }
}
.jarvis-orb-pulse {
  animation: jarvis-pulse 2s ease-in-out infinite;
}
.jarvis-orb-glow {
  box-shadow: 0 0 24px rgba(56, 189, 248, 0.55), 0 0 48px rgba(34, 211, 238, 0.2);
}
.jarvis-boot-fade {
  animation: fade-in 0.4s ease-out 0.1s forwards;
}
@keyframes fade-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.animate-fade-in {
  animation: fade-in 0.5s ease-out forwards;
}
.jarvis-mic-active {
  box-shadow: 0 0 16px rgba(34, 211, 238, 0.6), 0 0 32px rgba(56, 189, 248, 0.3);
}
.jarvis-orb-speaking {
  animation: jarvis-pulse 1s ease-in-out infinite;
}

/* Voice core */
.jarvis-voice-core--listening .jarvis-voice-core-stage {
  animation: jarvis-listen-vibrate 2.4s ease-in-out infinite;
}
.jarvis-voice-core-stage {
  transition: width 0.5s ease, height 0.5s ease;
}
.jarvis-core-orb {
  background: radial-gradient(circle at 35% 28%, #a5f3fc 0%, #22d3ee 28%, #0ea5e9 52%, #0369a1 78%, #0c4a6e 100%);
  box-shadow:
    0 0 40px rgba(34, 211, 238, 0.55),
    0 0 80px rgba(56, 189, 248, 0.25),
    inset 0 0 28px rgba(255, 255, 255, 0.2),
    inset 0 -8px 24px rgba(3, 105, 161, 0.5);
  border: 1px solid rgba(186, 230, 253, 0.35);
}
.jarvis-core-inner {
  background:
    radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.55), transparent 42%),
    radial-gradient(circle at 70% 75%, rgba(14, 165, 233, 0.35), transparent 50%);
}
.jarvis-core-shine {
  background: linear-gradient(
    135deg,
    rgba(255, 255, 255, 0.45) 0%,
    rgba(255, 255, 255, 0.08) 28%,
    transparent 45%,
    transparent 100%
  );
  mix-blend-mode: screen;
  pointer-events: none;
}
.jarvis-core-title--listening {
  color: #e0f2fe;
  text-shadow:
    0 0 20px rgba(34, 211, 238, 0.9),
    0 0 40px rgba(56, 189, 248, 0.45);
}
.jarvis-core-sublabel {
  color: rgba(125, 211, 252, 0.85);
}
.jarvis-core-sublabel-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #22d3ee;
  box-shadow: 0 0 10px rgba(34, 211, 238, 0.95);
  animation: jarvis-online-pulse 1.2s ease-in-out infinite;
}
.jarvis-core-dots {
  padding: 0 22%;
}
.jarvis-core-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ecfdf5, #2dd4bf 55%, #0891b2 100%);
  box-shadow: 0 0 14px rgba(45, 212, 191, 0.9), 0 0 24px rgba(34, 211, 238, 0.5);
  opacity: 0.55;
  transform: scale(0.85);
}
.jarvis-core-dot--live {
  animation: jarvis-core-dot-pulse 0.7s ease-in-out infinite alternate;
}
@keyframes jarvis-core-dot-pulse {
  0% { opacity: 0.45; transform: scale(0.75); box-shadow: 0 0 8px rgba(45, 212, 191, 0.6); }
  100% { opacity: 1; transform: scale(1.15); box-shadow: 0 0 18px rgba(45, 212, 191, 1), 0 0 32px rgba(34, 211, 238, 0.7); }
}
.jarvis-listen-pill {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.45rem 0.85rem;
  border-radius: 9999px;
  background: rgba(15, 23, 42, 0.75);
  border: 1px solid rgba(56, 189, 248, 0.2);
  color: rgba(186, 230, 253, 0.9);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: none;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.04);
}
.jarvis-listen-pill-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #4ade80;
  box-shadow: 0 0 10px rgba(74, 222, 128, 0.95);
  animation: jarvis-online-pulse 1.2s ease-in-out infinite;
  flex-shrink: 0;
}
.jarvis-listen-aura {
  pointer-events: none;
  background: radial-gradient(circle, rgba(34, 211, 238, 0.22), transparent 68%);
}
.jarvis-listen-aura-1 {
  animation: jarvis-listen-aura 2s ease-in-out infinite;
}
.jarvis-listen-aura-2 {
  animation: jarvis-listen-aura 2s ease-in-out infinite 0.6s;
  opacity: 0.6;
}
.jarvis-listen-scan {
  border: 1px dashed rgba(125, 211, 252, 0.35);
  animation: jarvis-spin 8s linear infinite;
  box-shadow: inset 0 0 30px rgba(34, 211, 238, 0.08);
}
@keyframes jarvis-listen-aura {
  0%, 100% { transform: scale(0.92); opacity: 0.45; }
  50% { transform: scale(1.08); opacity: 0.95; }
}
@keyframes jarvis-listen-vibrate {
  0%, 100% { transform: scale(1) translate(0, 0); }
  25% { transform: scale(1.02) translate(0.5px, -0.5px); }
  50% { transform: scale(1.04) translate(-0.5px, 0.5px); }
  75% { transform: scale(1.02) translate(0.5px, 0.5px); }
}
.jarvis-core-idle {
  animation: jarvis-core-breathe 3s ease-in-out infinite;
}
.jarvis-core-listening {
  animation: jarvis-core-listen-pulse 0.85s ease-in-out infinite;
  background: radial-gradient(circle at 35% 26%, #ecfeff 0%, #67e8f9 22%, #22d3ee 45%, #0284c7 70%, #075985 100%);
  box-shadow:
    0 0 50px rgba(34, 211, 238, 1),
    0 0 100px rgba(56, 189, 248, 0.45),
    0 0 140px rgba(14, 165, 233, 0.2),
    inset 0 0 36px rgba(255, 255, 255, 0.35),
    inset 0 -10px 30px rgba(2, 132, 199, 0.45);
  border-color: rgba(224, 242, 254, 0.55);
}
@keyframes jarvis-core-listen-pulse {
  0%, 100% {
    transform: scale(1);
    filter: brightness(1) saturate(1.1);
  }
  50% {
    transform: scale(1.08);
    filter: brightness(1.15) saturate(1.35);
  }
}
.jarvis-core-speaking {
  animation: jarvis-core-breathe 0.6s ease-in-out infinite;
}
.jarvis-core-searching {
  animation: jarvis-core-breathe 0.9s ease-in-out infinite;
  box-shadow: 0 0 42px rgba(34, 211, 238, 0.85);
}
.jarvis-core-opening {
  animation: jarvis-core-breathe 0.9s ease-in-out infinite;
  background: radial-gradient(circle at 35% 30%, #fde68a, #f59e0b 45%, #b45309 100%);
  box-shadow: 0 0 42px rgba(245, 158, 11, 0.8), inset 0 0 20px rgba(255, 255, 255, 0.15);
}
.jarvis-core-drawing {
  animation: jarvis-core-breathe 0.9s ease-in-out infinite;
  background: radial-gradient(circle at 35% 30%, #e9d5ff, #a855f7 45%, #6b21a8 100%);
  box-shadow: 0 0 42px rgba(168, 85, 247, 0.8), inset 0 0 20px rgba(255, 255, 255, 0.15);
}
.jarvis-core-clap {
  animation: jarvis-core-clap-flash 0.45s ease-in-out 3;
  background: radial-gradient(circle at 35% 30%, #fef9c3, #facc15 45%, #ca8a04 100%);
  box-shadow: 0 0 48px rgba(250, 204, 21, 0.95), inset 0 0 24px rgba(255, 255, 255, 0.2);
}
@keyframes jarvis-core-clap-flash {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.12); }
}
@keyframes jarvis-core-breathe {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.06); }
}

.jarvis-ring {
  animation: jarvis-ring-expand 2s ease-out infinite;
}
.jarvis-ring-listen {
  border-width: 2px;
  border-color: rgba(125, 211, 252, 0.55);
  box-shadow: 0 0 16px rgba(34, 211, 238, 0.35);
  animation: jarvis-ring-expand-listen 1.6s ease-out infinite;
}
@keyframes jarvis-ring-expand-listen {
  0% { transform: scale(0.75); opacity: 0.95; }
  100% { transform: scale(1.55); opacity: 0; }
}
.jarvis-ring-2 { animation-delay: 0.5s; }
.jarvis-ring-3 { animation-delay: 1s; }
@keyframes jarvis-ring-expand {
  0% { transform: scale(0.6); opacity: 0.8; }
  100% { transform: scale(1.4); opacity: 0; }
}

.jarvis-arc-spinner {
  animation: jarvis-spin 1.2s linear infinite;
}
@keyframes jarvis-spin {
  to { transform: rotate(360deg); }
}

.jarvis-wave-bar {
  height: 4px;
  animation: jarvis-wave 0.5s ease-in-out infinite alternate;
}
@keyframes jarvis-wave {
  from { height: 4px; opacity: 0.5; }
  to { height: 22px; opacity: 1; }
}

/* Ambient bubbles */
.jarvis-bubble {
  background: radial-gradient(circle at 30% 30%, rgba(56, 189, 248, 0.15), rgba(14, 165, 233, 0.04));
  border: 1px solid rgba(56, 189, 248, 0.12);
  animation: jarvis-bubble-float 8s ease-in-out infinite;
}
@keyframes jarvis-bubble-float {
  0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.5; }
  33% { transform: translate(12px, -18px) scale(1.05); opacity: 0.7; }
  66% { transform: translate(-8px, 10px) scale(0.95); opacity: 0.4; }
}
.jarvis-ambient-glow {
  background:
    radial-gradient(ellipse 80% 50% at 50% 0%, rgba(14, 165, 233, 0.12), transparent),
    radial-gradient(ellipse 60% 40% at 100% 100%, rgba(34, 211, 238, 0.08), transparent);
}

/* Chat bubbles */
.jarvis-bubble-user {
  color: #f0f9ff;
  background: linear-gradient(135deg, rgba(14, 165, 233, 0.55), rgba(2, 132, 199, 0.4));
  border: 1px solid rgba(56, 189, 248, 0.5);
  border-radius: 18px 18px 4px 18px;
  box-shadow: 0 4px 20px rgba(14, 165, 233, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.08);
}
.jarvis-bubble-assistant {
  color: #e0f2fe;
  background: linear-gradient(135deg, rgba(15, 29, 50, 0.98), rgba(10, 22, 40, 0.95));
  border: 1px solid rgba(56, 189, 248, 0.35);
  border-radius: 18px 18px 18px 4px;
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(56, 189, 248, 0.1);
}
.jarvis-bubble-system {
  color: #7dd3fc;
  background: rgba(14, 165, 233, 0.12);
  border: 1px dashed rgba(56, 189, 248, 0.35);
  border-radius: 12px;
}

.jarvis-panel {
  background: linear-gradient(180deg, #0a1628 0%, #030712 100%);
  border-left: 1px solid var(--jarvis-border);
}

.jarvis-header-glass {
  background: rgba(10, 22, 40, 0.85);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--jarvis-border);
}

.jarvis-input-bar {
  background: rgba(10, 22, 40, 0.9);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--jarvis-border);
}

.jarvis-mic-btn {
  background: linear-gradient(135deg, #0ea5e9, #0284c7);
  box-shadow: 0 0 20px rgba(14, 165, 233, 0.4);
}
.jarvis-mic-btn:hover {
  box-shadow: 0 0 28px rgba(34, 211, 238, 0.5);
}
.jarvis-mic-btn-active {
  background: linear-gradient(135deg, #22d3ee, #0ea5e9);
  animation: jarvis-pulse 1.5s ease-in-out infinite;
}

.jarvis-typing-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #38bdf8;
  animation: jarvis-typing 1s ease-in-out infinite;
}
@keyframes jarvis-typing {
  0%, 100% { opacity: 0.3; transform: translateY(0); }
  50% { opacity: 1; transform: translateY(-3px); }
}

@keyframes jarvis-type-cursor {
  50% { opacity: 0; }
}

/* Presentation mode — enlarged cockpit text for demos */
html.jarvis-presentation .jarvis-drawer,
html.jarvis-presentation [class*="text-sm"],
html.jarvis-presentation [class*="text-xs"] {
  font-size: calc(1em * 1.15);
}
html.jarvis-presentation .jarvis-drawer textarea,
html.jarvis-presentation .jarvis-drawer .rounded-lg {
  font-size: 0.95rem;
}
@keyframes jarvis-sheet-in {
  from { transform: translateX(100%); }
  to { transform: translateX(0); }
}
.jarvis-sheet-enter {
  animation: jarvis-sheet-in 0.3s ease-out forwards;
}

/* Full-page HUD rings */
.jarvis-hud-spin-slow {
  animation: jarvis-spin 48s linear infinite;
}
.jarvis-hud-spin-reverse {
  animation: jarvis-spin 32s linear infinite reverse;
}
.jarvis-hud-spin-mid {
  animation: jarvis-spin 20s linear infinite;
}
.jarvis-hud-pulse-ring {
  animation: jarvis-hud-pulse 3s ease-in-out infinite;
}
@keyframes jarvis-hud-pulse {
  0%, 100% { stroke-opacity: 0.55; }
  50% { stroke-opacity: 1; }
}
.jarvis-fullpage .jarvis-hud-rings {
  opacity: 0.85;
  pointer-events: none;
}
.jarvis-center-stage {
  overflow: visible;
}
.jarvis-hud-rings-stage {
  width: min(88vw, 480px);
  height: min(88vw, 480px);
  max-width: 100%;
  max-height: min(62vh, 480px);
  opacity: 0.9;
  z-index: 0;
  transition: opacity 0.4s ease, filter 0.4s ease, transform 0.4s ease;
}
.jarvis-hud-rings--listening {
  opacity: 1;
  filter: drop-shadow(0 0 28px rgba(34, 211, 238, 0.45));
  animation: jarvis-hud-rings-breathe 1.2s ease-in-out infinite;
}
@keyframes jarvis-hud-rings-breathe {
  0%, 100% { transform: translate(-50%, -50%) scale(1); }
  50% { transform: translate(-50%, -50%) scale(1.04); }
}
@media (min-width: 768px) {
  .jarvis-hud-rings-stage {
    width: min(100%, 520px);
    height: min(100%, 520px);
    max-height: min(72vh, 520px);
  }
  .jarvis-hud-rings--listening.jarvis-hud-rings-stage {
    width: min(100%, 560px);
    height: min(100%, 560px);
    max-height: min(76vh, 560px);
  }
}
.jarvis-fullpage .jarvis-hud-side {
  display: none;
}

/* Iron Man HUD frame */
.jarvis-hud-frame {
  background: radial-gradient(ellipse 70% 50% at 50% 40%, rgba(14, 165, 233, 0.06), transparent 70%);
}
.jarvis-hud-grid {
  background-image:
    linear-gradient(rgba(56, 189, 248, 0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(56, 189, 248, 0.04) 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: radial-gradient(ellipse 80% 70% at 50% 50%, black 20%, transparent 75%);
}
.jarvis-hud-scanline {
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(56, 189, 248, 0.015) 2px,
    rgba(56, 189, 248, 0.015) 4px
  );
  animation: jarvis-scan 8s linear infinite;
}
@keyframes jarvis-scan {
  0% { transform: translateY(0); }
  100% { transform: translateY(48px); }
}
.jarvis-hud-corner {
  position: absolute;
  width: 28px;
  height: 28px;
  border-color: rgba(34, 211, 238, 0.45);
  border-style: solid;
  z-index: 15;
  pointer-events: none;
}
.jarvis-hud-corner-tl { top: 12px; left: 12px; border-width: 2px 0 0 2px; }
.jarvis-hud-corner-tr { top: 12px; right: 12px; border-width: 2px 2px 0 0; }
.jarvis-hud-corner-bl { bottom: 12px; left: 12px; border-width: 0 0 2px 2px; }
.jarvis-hud-corner-br { bottom: 12px; right: 12px; border-width: 0 2px 2px 0; }
.jarvis-hud-side {
  position: absolute;
  top: 15%;
  bottom: 15%;
  width: 1px;
  background: linear-gradient(180deg, transparent, rgba(56, 189, 248, 0.25), transparent);
  z-index: 12;
}
.jarvis-hud-side-left { left: 12%; }
.jarvis-hud-side-right { right: 12%; }
.jarvis-hud-panel {
  padding: 0.75rem;
  border: 1px solid rgba(56, 189, 248, 0.12);
  background: rgba(3, 7, 18, 0.55);
  backdrop-filter: blur(8px);
  border-radius: 2px;
  align-self: stretch;
}
.jarvis-hud-panel-comms {
  align-self: stretch;
}
.jarvis-hud-panel-title {
  border-bottom: 1px solid rgba(56, 189, 248, 0.15);
  padding-bottom: 0.35rem;
  width: 100%;
}
.jarvis-interim-display {
  border: 1px solid rgba(34, 211, 238, 0.25);
  background: rgba(8, 47, 73, 0.35);
  border-radius: 2px;
  box-shadow: 0 0 24px rgba(34, 211, 238, 0.08), inset 0 0 20px rgba(56, 189, 248, 0.05);
}
.jarvis-status-chip-active {
  animation: jarvis-chip-pulse 2s ease-in-out infinite;
}
@keyframes jarvis-chip-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(34, 211, 238, 0.3); }
  50% { box-shadow: 0 0 12px 2px rgba(34, 211, 238, 0.15); }
}
.jarvis-mic-continuous {
  animation: jarvis-pulse 2s ease-in-out infinite;
}
.jarvis-arc-reactor-glow {
  background: radial-gradient(circle, rgba(34, 211, 238, 0.2), transparent 70%);
  transition: opacity 0.3s;
}
.jarvis-reactor-idle { opacity: 0.35; animation: jarvis-reactor-idle 4s ease-in-out infinite; }
.jarvis-reactor-listening {
  opacity: 1;
  background: radial-gradient(circle, rgba(34, 211, 238, 0.55), rgba(14, 165, 233, 0.12) 55%, transparent 72%);
  animation: jarvis-reactor-listen 0.85s ease-in-out infinite;
  filter: blur(0.5px);
}
.jarvis-reactor-thinking { opacity: 0.75; animation: jarvis-spin 2s linear infinite; }
.jarvis-reactor-speaking { opacity: 1; animation: jarvis-reactor-speak 0.5s ease-in-out infinite; }
.jarvis-reactor-searching {
  opacity: 0.95;
  background: radial-gradient(circle, rgba(34, 211, 238, 0.32), transparent 70%);
  animation: jarvis-reactor-listen 0.9s ease-in-out infinite;
}
.jarvis-reactor-opening {
  opacity: 0.95;
  background: radial-gradient(circle, rgba(245, 158, 11, 0.3), transparent 70%);
  animation: jarvis-reactor-listen 1s ease-in-out infinite;
}
.jarvis-reactor-drawing {
  opacity: 0.95;
  background: radial-gradient(circle, rgba(168, 85, 247, 0.3), transparent 70%);
  animation: jarvis-reactor-listen 1s ease-in-out infinite;
}
.jarvis-reactor-clap {
  opacity: 1;
  background: radial-gradient(circle, rgba(250, 204, 21, 0.35), transparent 70%);
  animation: jarvis-reactor-listen 0.45s ease-in-out infinite;
}

/* Activity status pill (full-page HUD) */
.jarvis-activity-status {
  border: 1px solid rgba(56, 189, 248, 0.4);
  background: rgba(8, 47, 73, 0.55);
  color: rgba(186, 230, 253, 0.95);
  backdrop-filter: blur(6px);
  transition: color 0.25s, border-color 0.25s, background 0.25s;
}
.jarvis-activity-dot {
  width: 6px;
  height: 6px;
  border-radius: 9999px;
  background: currentColor;
  box-shadow: 0 0 8px currentColor;
  animation: jarvis-activity-dot-pulse 1.1s ease-in-out infinite;
}
@keyframes jarvis-activity-dot-pulse {
  0%, 100% { opacity: 0.4; transform: scale(0.85); }
  50% { opacity: 1; transform: scale(1.15); }
}
.jarvis-activity-searching { color: #67e8f9; border-color: rgba(34, 211, 238, 0.55); }
.jarvis-activity-opening { color: #fbbf24; border-color: rgba(245, 158, 11, 0.55); background: rgba(69, 39, 6, 0.5); }
.jarvis-activity-drawing { color: #d8b4fe; border-color: rgba(168, 85, 247, 0.55); background: rgba(59, 7, 100, 0.45); }
.jarvis-activity-speaking { color: #7dd3fc; }
.jarvis-activity-thinking { color: #38bdf8; }
.jarvis-activity-listening { color: #22d3ee; }
.jarvis-activity-clap { color: #fef08a; border-color: rgba(250, 204, 21, 0.65); background: rgba(66, 52, 6, 0.55); }
.jarvis-activity-clap .jarvis-activity-dot { background: #fde047; animation-duration: 0.45s; }
@keyframes jarvis-reactor-idle {
  0%, 100% { transform: scale(1); opacity: 0.35; }
  50% { transform: scale(1.05); opacity: 0.5; }
}
@keyframes jarvis-reactor-listen {
  0%, 100% { transform: scale(1); opacity: 0.85; }
  50% { transform: scale(1.18); opacity: 1; }
}
@keyframes jarvis-reactor-speak {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}
.jarvis-core-triangle {
  border-left: 6px solid transparent;
  border-right: 6px solid transparent;
  border-bottom: 10px solid rgba(255, 255, 255, 0.5);
  top: 38%;
}

/* —— Next-gen cockpit UI —— */
.jarvis-cockpit {
  background:
    radial-gradient(ellipse 90% 60% at 50% 0%, rgba(14, 116, 178, 0.12), transparent 55%),
    radial-gradient(ellipse 50% 40% at 50% 45%, rgba(34, 211, 238, 0.06), transparent 60%),
    #020617;
}
.jarvis-cockpit-header {
  background: linear-gradient(180deg, rgba(3, 7, 18, 0.95), rgba(3, 7, 18, 0.6));
  border-bottom: 1px solid rgba(56, 189, 248, 0.18);
  backdrop-filter: blur(12px);
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
}
.jarvis-title {
  text-shadow: 0 0 40px rgba(34, 211, 238, 0.25);
}
.jarvis-online-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
